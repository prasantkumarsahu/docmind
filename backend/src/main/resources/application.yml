spring:
  application:
    name: docmind
  datasource:
    url: jdbc:postgresql://localhost:5433/docmind
    username: docmind
    password: docmind
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${CHAT_MODEL:llama3.2:3b}
          temperature: 0.2
      embedding:
        options:
          model: ${EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        index-type: hnsw
        distance-type: cosine-distance

docmind:
  retrieval:
    top-k: 5
    similarity-threshold: 0.5
  chunking:
    chunk-size: 400
  memory:
    max-messages: 12
  cors:
    allowed-origins: http://localhost:5173

management:
  endpoints:
    web:
      exposure:
        include: health,info
